services:
  caddy:
    image: caddy:2-alpine
    container_name: mdplanner-caddy
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mdplanner
      - ollama
      - searxng
      - chatterbox
    restart: unless-stopped
    networks:
      - ai-net

  mdplanner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mdplanner
    volumes:
      - mdplanner-data:/data
      - mdplanner-backups:/backups
    # Secrets in .env next to this file:
    #   MDPLANNER_WEBDAV_USER=obsidian
    #   MDPLANNER_WEBDAV_PASS=changeme
    #   MDPLANNER_MCP_TOKEN=secret
    #   MDPLANNER_SECRET_KEY=<64-char hex>   # run: mdplanner keygen-secret
    #   MDPLANNER_BACKUP_PUBLIC_KEY=<PEM>    # run: mdplanner keygen  (public key only)
    environment:
      # ── v2 supported env vars ────────────────────────────────────────────────
      - PROJECT_DIR=/data # absolute path to data directory (mounted volume)
      - CACHE=${CACHE:-true} # set to "false" to disable SQLite cache
      - PORT=${PORT:-8003} # HTTP port inside the container
      - MCP_TOKEN=${MCP_TOKEN:-} # bearer token for MCP API access (leave empty to disable auth)
      # AES-256-GCM key for encrypting integration secrets (e.g. Cloudflare API token in project.md).
      # Generate with: openssl rand -hex 32
      # Leave empty to store tokens in plaintext.
      - MDPLANNER_SECRET_KEY=${MDPLANNER_SECRET_KEY:-}
    restart: unless-stopped
    networks:
      - ai-net

  ollama:
    image: ollama/ollama:0.16.2
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - ai-net
    # ── GPU support (NVIDIA) ───────────────────────────────────────────────────
    # Linux + NVIDIA GPU: requires NVIDIA Container Toolkit
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    # macOS / CPU-only: remove or comment out the entire deploy block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  chatterbox:
    build:
      context: ./chatterbox
    container_name: chatterbox
    volumes:
      # Voice reference WAV files — add your .wav files here
      - ./chatterbox/references:/app/references:ro
      # Cache downloaded HuggingFace models across restarts
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - ai-net
    # ── GPU support (NVIDIA) ───────────────────────────────────────────────────
    # macOS / CPU-only: remove or comment out the entire deploy block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    restart: unless-stopped
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge

volumes:
  mdplanner-data:
  mdplanner-backups:
  ollama-data:
  huggingface-cache:
  searxng-data:
